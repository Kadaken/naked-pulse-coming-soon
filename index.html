<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naked Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-desktop: url('/coming_soong_web.jpg');
      --bg-mobile: url('/coming_soon_mobile.jpg');
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background-image: var(--bg-desktop);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    @media (max-width: 768px) {
      body {
        background-image: var(--bg-mobile);
      }
    }

    /* Full-viewport wrapper */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: clamp(60px, 15vh, 140px);
    }

    /* Soft radial gradient behind text for legibility */
    .glow-bg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 90vw);
      height: 60vh;
      background: radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0.58) 0%, rgba(0,0,0,0) 68%);
      pointer-events: none;
    }

    /* Text block */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3rem, 8vw, 6.5rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1;
      color: #fff;
      text-shadow: 0 2px 24px rgba(0,0,0,0.4);
    }

    .subhead {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.78);
      margin-top: 0.55em;
      text-shadow: 0 1px 12px rgba(0,0,0,0.4);
    }

    /* Divider */
    .divider {
      width: 48px;
      height: 1px;
      background: rgba(255,255,255,0.35);
      margin: 2em auto;
    }

    /* Email form */
    .form-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65em;
      width: min(340px, 88vw);
    }

    .input-row {
      display: flex;
      width: 100%;
      gap: 0;
    }

    input[type="email"] {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.35);
      border-right: none;
      color: #fff;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      padding: 0.7em 1em;
      outline: none;
      border-radius: 2px 0 0 2px;
      transition: background 0.2s, border-color 0.2s;
      -webkit-appearance: none;
    }

    input[type="email"]::placeholder { color: rgba(255,255,255,0.45); }
    input[type="email"]:focus {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.6);
    }

    button.submit-btn {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.7em 1.1em;
      cursor: pointer;
      border-radius: 0 2px 2px 0;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    button.submit-btn:hover {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.6);
    }

    button.submit-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .form-message {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.7);
      min-height: 1.2em;
      text-align: center;
    }

    .form-message.error { color: rgba(255,160,160,0.85); }

    /* ChatGPT link */
    .gpt-link {
      margin-top: 2.2em;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.52);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .gpt-link:hover {
      color: rgba(255,255,255,0.85);
      border-color: rgba(255,255,255,0.5);
    }

    /* Audio toggle */
    #audio-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      z-index: 10;
    }

    #audio-toggle:hover {
      background: rgba(0,0,0,0.65);
      border-color: rgba(255,255,255,0.45);
    }

    #audio-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <audio id="bg-audio" src="/audio/ambient.mp3" loop preload="auto"></audio>

  <div class="scene">
    <div class="glow-bg" aria-hidden="true"></div>

    <div class="content">
      <h1>Naked Pulse</h1>
      <p class="subhead">Coming soon.</p>

      <div class="divider" aria-hidden="true"></div>

      <div class="form-wrap">
        <div class="input-row">
          <input
            type="email"
            id="email-input"
            placeholder="your@email.com"
            required
            autocomplete="email"
            aria-label="Email address"
          />
          <button class="submit-btn" id="submit-btn" type="button">Notify Me</button>
        </div>
        <p class="form-message" id="form-msg" aria-live="polite"></p>
      </div>

      <a
        class="gpt-link"
        href="https://chatgpt.com/g/g-699f4ad3e8b08191bcdbf6f1982a6f01-naked-pulse"
        target="_blank"
        rel="noopener noreferrer"
      >In the meantime → Talk to Naked Pulse on ChatGPT</a>
    </div>
  </div>

  <button id="audio-toggle" aria-label="Toggle sound">
    <!-- muted icon by default -->
    <svg viewBox="0 0 24 24" id="audio-icon">
      <!-- speaker body -->
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <!-- muted X lines -->
      <line x1="23" y1="9" x2="17" y2="15" id="mute-x1"/>
      <line x1="17" y1="9" x2="23" y2="15" id="mute-x2"/>
    </svg>
  </button>

  <script>
    // ── Supabase config ─────────────────────────────────────────────────────
    const SUPABASE_URL = "https://example.invalid";
    const SUPABASE_ANON_KEY = "[removed-defunct-client-key]";

    async function submitEmail(email) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/waitlist`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ email })
      });
      if (!r.ok && r.status !== 409) throw new Error(await r.text());
      // 409 = duplicate email — treat as success silently
    }

    // ── Form logic ───────────────────────────────────────────────────────────
    const emailInput = document.getElementById("email-input");
    const submitBtn  = document.getElementById("submit-btn");
    const formMsg    = document.getElementById("form-msg");

    submitBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      if (!email || !emailInput.checkValidity()) {
        formMsg.textContent = "Please enter a valid email.";
        formMsg.className = "form-message error";
        return;
      }
      submitBtn.disabled = true;
      formMsg.textContent = "";
      formMsg.className = "form-message";
      try {
        await submitEmail(email);
        formMsg.textContent = "Thanks — we'll be in touch.";
        formMsg.className = "form-message";
        emailInput.value = "";
      } catch (err) {
        console.error(err);
        formMsg.textContent = "Something went wrong. Please try again.";
        formMsg.className = "form-message error";
        submitBtn.disabled = false;
      }
    });

    emailInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitBtn.click();
    });

    // ── Audio toggle ─────────────────────────────────────────────────────────
    const audio  = document.getElementById("bg-audio");
    const btn    = document.getElementById("audio-toggle");
    const icon   = document.getElementById("audio-icon");
    let playing  = false;

    // SVG paths
    const SPEAKER_BODY = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>`;
    const MUTED_LINES  = `<line x1="23" y1="9" x2="17" y2="15"/>
                          <line x1="17" y1="9" x2="23" y2="15"/>`;
    const SOUND_WAVES  = `<path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;

    btn.addEventListener("click", () => {
      if (playing) {
        audio.pause();
        playing = false;
        icon.innerHTML = SPEAKER_BODY + MUTED_LINES;
      } else {
        audio.play().catch(() => {});
        playing = true;
        icon.innerHTML = SPEAKER_BODY + SOUND_WAVES;
      }
    });
  </script>

</body>
</html>

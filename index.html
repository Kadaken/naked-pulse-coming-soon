<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naked Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background-image: url('/coming_soong_web.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    @media (max-width: 768px) {
      body {
        background-image: url('/coming_soon_mobile.jpg');
        background-position: center top;
      }
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: clamp(40px, 10vh, 120px);
    }

    @media (max-width: 768px) {
      .scene {
        padding-top: clamp(32px, 8vh, 80px);
      }
    }

    .glow-bg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 95vw);
      height: 65vh;
      background: radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 68%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.6rem, 10vw, 6.5rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1;
      color: #fff;
      text-shadow: 0 2px 24px rgba(0,0,0,0.5);
    }

    .subhead {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(0.95rem, 3vw, 1.5rem);
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.78);
      margin-top: 0.5em;
      text-shadow: 0 1px 12px rgba(0,0,0,0.5);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.35);
      margin: 1.6em auto;
    }

    .form-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6em;
      width: min(320px, 88vw);
    }

    .input-row {
      display: flex;
      width: 100%;
    }

    input[type="email"] {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.35);
      border-right: none;
      color: #fff;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      padding: 0.75em 1em;
      outline: none;
      border-radius: 2px 0 0 2px;
      -webkit-appearance: none;
      transition: background 0.2s, border-color 0.2s;
    }

    input[type="email"]::placeholder { color: rgba(255,255,255,0.4); }
    input[type="email"]:focus {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.6);
    }

    button.submit-btn {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.75em 1.1em;
      cursor: pointer;
      border-radius: 0 2px 2px 0;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    button.submit-btn:hover, button.submit-btn:active {
      background: rgba(255,255,255,0.24);
      border-color: rgba(255,255,255,0.6);
    }

    button.submit-btn:disabled { opacity: 0.5; cursor: default; }

    .form-message {
      font-size: 0.78rem;
      letter-spacing: 0.07em;
      color: rgba(255,255,255,0.7);
      min-height: 1.2em;
      text-align: center;
    }

    .form-message.error { color: rgba(255,160,160,0.9); }

    .gpt-link {
      margin-top: 2em;
      font-size: 0.72rem;
      letter-spacing: 0.09em;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .gpt-link:hover, .gpt-link:active {
      color: rgba(255,255,255,0.85);
      border-color: rgba(255,255,255,0.5);
    }

    /* Audio toggle — larger touch target on mobile */
    #audio-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #audio-toggle:hover, #audio-toggle:active {
      background: rgba(0,0,0,0.7);
    }

    #audio-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <audio id="bg-audio" src="/audio/ambient.mp3" loop preload="auto"></audio>

  <div class="scene">
    <div class="glow-bg" aria-hidden="true"></div>

    <div class="content">
      <h1>Naked Pulse</h1>
      <p class="subhead">Coming soon.</p>

      <div class="divider" aria-hidden="true"></div>

      <div class="form-wrap">
        <div class="input-row">
          <input
            type="email"
            id="email-input"
            placeholder="your@email.com"
            required
            autocomplete="email"
            aria-label="Email address"
          />
          <button class="submit-btn" id="submit-btn" type="button">Notify Me</button>
        </div>
        <p class="form-message" id="form-msg" aria-live="polite"></p>
      </div>

      <a
        class="gpt-link"
        href="https://chatgpt.com/g/g-699f4ad3e8b08191bcdbf6f1982a6f01-naked-pulse"
        target="_blank"
        rel="noopener noreferrer"
      >In the meantime → Talk to Naked Pulse on ChatGPT</a>
    </div>
  </div>

  <button id="audio-toggle" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24" id="audio-icon">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <line x1="23" y1="9" x2="17" y2="15"/>
      <line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
  </button>

  <script>
    function requestNotification(email) {
      const subject = encodeURIComponent("Naked Pulse updates");
      const body = encodeURIComponent(`Please notify me at ${email} when Naked Pulse is available.`);
      window.location.href = `mailto:support@kadaken.com?subject=${subject}&body=${body}`;
    }

    const emailInput = document.getElementById("email-input");
    const submitBtn  = document.getElementById("submit-btn");
    const formMsg    = document.getElementById("form-msg");

    submitBtn.addEventListener("click", () => {
      const email = emailInput.value.trim();
      if (!email || !emailInput.checkValidity()) {
        formMsg.textContent = "Please enter a valid email.";
        formMsg.className = "form-message error";
        return;
      }
      formMsg.textContent = "Opening your email app — send the prepared message to join the update list.";
      formMsg.className = "form-message";
      requestNotification(email);
    });

    emailInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitBtn.click();
    });

    // Audio
    const audio = document.getElementById("bg-audio");
    const btn   = document.getElementById("audio-toggle");
    const icon  = document.getElementById("audio-icon");
    let playing = false;

    const BODY  = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>`;
    const MUTED = `<line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
    const WAVES = `<path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;

    btn.addEventListener("click", () => {
      if (playing) {
        audio.pause();
        playing = false;
        icon.innerHTML = BODY + MUTED;
      } else {
        audio.play().catch(() => {});
        playing = true;
        icon.innerHTML = BODY + WAVES;
      }
    });
  </script>

</body>
</html>
